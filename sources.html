<style>
  :root{
    --black: #111111;
    --white: #FFFFFF;
    --orange: #E85D04;
    --ink: #111111;
    --ink-soft: #5B5B5B;
    --line: #E3E3E3;
    --paper: #FFFFFF;
    --display: 'Archivo Black', 'Public Sans', sans-serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--ink); }
  a:hover{ color:var(--orange); }

  .siteheader{
    max-width: 800px;
    margin: 0 auto;
    padding: 2.2rem 1.5rem 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .wordmark{ display:flex; align-items:center; text-decoration:none; }
  .wordmark img{ display:block; height: 1.9rem; width:auto; }
  .siteheader__nav{ display:flex; align-items:center; gap:1.5rem; }
  .siteheader__nav a{
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
  }
  .siteheader__nav a:hover{ color:var(--orange); }

  .pagehead{
    max-width: 800px;
    margin: 0 auto;
    padding: 3rem 1.5rem 2.5rem;
  }
  .pagehead h1{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(2rem, 5vw, 2.9rem);
    text-transform: uppercase;
    letter-spacing: 0.005em;
    line-height:1.08;
    margin: 0 0 1rem;
  }
  .pagehead p{
    font-size:1.02rem;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0;
  }

  main{
    max-width: 800px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .region{ padding-top: 3rem; }
  .region__head{
    display:flex;
    align-items:center;
    gap:0.9rem;
    margin-bottom: 0.6rem;
  }
  .region__tab{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:2.3rem;
    height:2.3rem;
    border-radius:6px;
    background: var(--orange);
    color:#fff;
    font-family:var(--display);
    font-weight:600;
    font-size:1rem;
    flex-shrink:0;
  }
  .region__head h2{
    font-family:var(--display);
    font-weight:500;
    font-size:1.25rem;
    text-transform: uppercase;
    letter-spacing:0.01em;
    color: var(--orange);
    margin:0;
    line-height:1.15;
  }
  .region__note{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin: 0 0 1.3rem 3.2rem;
    max-width: 58ch;
  }

  .linklist{
    list-style:none;
    margin:0 0 1.6rem;
    padding:0;
    border-top: 1px solid var(--line);
  }
  .linklist li{
    border-bottom: 1px solid var(--line);
    padding: 0.85rem 0.1rem;
  }
  .linklist a{
    font-weight:600;
    font-size:0.98rem;
    text-decoration:none;
    display:block;
  }
  .linklist a:hover{ color:var(--orange); }
  .linklist .note{
    color:var(--ink-soft);
    font-size:0.86rem;
    margin-top:0.2rem;
  }

  .coachgroup{ margin: 0 0 1.6rem; }
  .coachgroup h3{
    font-family:var(--sans);
    font-size:0.95rem;
    font-weight:700;
    margin: 0 0 0.15rem;
  }
  .coachgroup .bio{
    color:var(--ink-soft);
    font-size:0.88rem;
    margin: 0 0 0.6rem;
    max-width:58ch;
  }

  .directories{
    padding-top: 3rem;
    border-top: 2px solid var(--black);
  }
  .directories h2{
    font-family:var(--display);
    font-weight:500;
    font-size:1.1rem;
    text-transform: uppercase;
    margin: 0 0 0.5rem;
  }
  .directories p{ color:var(--ink-soft); font-size:0.9rem; margin:0 0 1rem; max-width:60ch; }
  .directories ul{ list-style:none; margin:0; padding:0; columns: 2; column-gap:2rem; }
  .directories li{ margin-bottom:0.5rem; font-size:0.9rem; break-inside: avoid; }
  @media (max-width: 560px){ .directories ul{ columns: 1; } }

  footer{
    background: var(--black);
    margin-top: 3rem;
    padding: 3rem 1.5rem 3.5rem;
  }
  .footer__inner{ max-width:800px; margin: 0 auto; }
  .footer__inner img{ height:1.6rem; width:auto; margin-bottom:1.1rem; display:block; }
  .footer__inner p{ color: rgba(255,255,255,0.62); font-size:0.85rem; max-width: 62ch; margin:0; }
  .footer__inner a{ color:#fff; }
  .footer__inner a:hover{ color:var(--orange); }
</style>
</head>

function renderLinkList(links){
  return `<ul class="linklist">${links.map(l => `
    <li>
      <a href="${l.url}" target="_blank" rel="noopener">${l.title}</a>
      ${l.note ? `<div class="note">${l.note}</div>` : ''}
    </li>`).join('')}</ul>`;
}

function renderRegion(region, index){
  const groups = region.groups ? region.groups.map(g => `
    <div class="coachgroup">
      <h3>${g.name}</h3>
      <p class="bio">${g.bio}</p>
      ${renderLinkList(g.links)}
    </div>
  `).join('') : '';

  return `
  <section class="region">
    <div class="region__head">
      <span class="region__tab">${index + 1}</span>
      <h2>${region.region}</h2>
    </div>
    ${region.note ? `<p class="region__note">${region.note}</p>` : ''}
    ${region.links ? renderLinkList(region.links) : ''}
    ${groups}
  </section>`;
}

function renderDirectories(){
  return `
  <section class="directories">
    <h2>Directory pages</h2>
    <p>Used to find the clubs above — not technique sources themselves.</p>
    <ul>${DIRECTORIES.map(d => `<li><a href="${d.url}" target="_blank" rel="noopener">${d.title}</a></li>`).join('')}</ul>
  </section>`;
}

document.getElementById('main').innerHTML = SOURCES.map(renderRegion).join('') + renderDirectories();
