<style>
  :root{
    --black: #111111;
    --white: #FFFFFF;
    --orange: #E85D04;
    --ink: #111111;
    --ink-soft: #5B5B5B;
    --line: #E3E3E3;
    --paper: #FFFFFF;
    --display: 'Archivo Black', 'Public Sans', sans-serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--ink); }
  a:hover{ color:var(--orange); }

  .siteheader{
    max-width: 800px;
    margin: 0 auto;
    padding: 2.2rem 1.5rem 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .wordmark{ display:flex; align-items:center; text-decoration:none; }
  .wordmark img{ display:block; height: 1.9rem; width:auto; }
  .siteheader__nav{ display:flex; align-items:center; gap:1.3rem; flex-wrap:wrap; justify-content:flex-end; }
  .siteheader__nav a{
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
  }
  .siteheader__nav a:hover{ color:var(--orange); }
  .siteheader__nav a.active{ color:var(--orange); }

  .pagehead{
    max-width: 800px;
    margin: 0 auto;
    padding: 3rem 1.5rem 1rem;
  }
  .pagehead h1{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(2rem, 5vw, 2.9rem);
    text-transform: uppercase;
    letter-spacing: 0.005em;
    line-height:1.08;
    margin: 0 0 1rem;
  }
  .pagehead p{
    font-size:1.02rem;
    color:var(--ink-soft);
    max-width:62ch;
    margin:0 0 0.6rem;
  }

  main{
    max-width: 800px;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 4rem;
  }

  .glosslist{ border-top: 1px solid var(--line); }
  .glossentry{
    padding: 1.3rem 0.1rem;
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 1.5rem;
  }
  .glossentry dt{
    font-family:var(--display);
    font-size:1.1rem;
    font-weight:500;
    margin: 0 0 0.4rem;
  }
  .glossentry dd{
    margin:0;
    font-size:0.96rem;
    color:var(--ink-soft);
    max-width:60ch;
  }
  .glossentry:target{
    background: #FFF6EF;
    margin: 0 -1rem;
    padding: 1.3rem 1rem;
  }

  footer{
    background: var(--black);
    margin-top: 3rem;
    padding: 3rem 1.5rem 3.5rem;
  }
  .footer__inner{ max-width:800px; margin: 0 auto; }
  .footer__inner img{ height:1.6rem; width:auto; margin-bottom:1.1rem; display:block; }
  .footer__inner p{ color: rgba(255,255,255,0.62); font-size:0.85rem; max-width: 62ch; margin:0; }
  .footer__inner a{ color:#fff; }
  .footer__inner a:hover{ color:var(--orange); }
</style>
</head>

<script>
const GLOSSARY = [{"slug": "ama", "term": "Ama", "def": "The outrigger float, connected to the main hull by the iako. What keeps an outrigger canoe from tipping over sideways \u2014 and the side you always re-board from after a huli."}, {"slug": "attack-distance", "term": "Attack Distance", "def": "The proper distance range for an entering paddler to be from the canoe as it arrives during a water change \u2014 no more than an arm's length away, no less than a foot."}, {"slug": "bump", "term": "Bump", "def": "A wave or wake a canoe can catch and ride for extra speed, similar to surfing. Elite crews read several bumps ahead rather than catching whatever's directly in front of them."}, {"slug": "carry", "term": "Carry", "def": "The momentum a hull holds onto once it's moving. A heavier hull has more carry \u2014 it holds speed through a bump longer once caught \u2014 but takes longer to build that speed in the first place."}, {"slug": "changeover", "term": "Changeover", "def": "The crew switching paddling sides together, called by \u201cHut,\u201d executed on the recovery phase of the next stroke so the boat never loses rhythm or speed. Also just called a \u201cchange.\u201d"}, {"slug": "draw-stroke", "term": "Draw Stroke", "def": "An active steering stroke that pulls the stern toward the paddle side \u2014 used for a stronger, more deliberate correction than a post."}, {"slug": "escort-boat", "term": "Escort Boat", "def": "The support boat in a Nine-Man race carrying the 3 paddlers not currently in the canoe, plus hydration, food, and safety gear. Its skipper is making real-time navigation and safety calls the entire race."}, {"slug": "front-support-position", "term": "Front Support Position", "def": "The body position immediately after grabbing the canoe during a water change \u2014 both hands and the hip line on the gunwale, weight on the hands \u2014 right before swinging the legs in and getting seated."}, {"slug": "huli", "term": "Huli", "def": "A capsize \u2014 the canoe flipping over. Also used as a verb (\u201cwe hulied\u201d) and as the name for the recovery drill every crew practices to right the canoe and re-board."}, {"slug": "hut", "term": "Hut", "def": "The verbal call for a changeover, given one stroke before the crew actually switches sides \u2014 not an instruction to switch immediately."}, {"slug": "hyponatremia", "term": "Hyponatremia", "def": "A dangerously low blood-sodium level caused by drinking too much plain water without replacing electrolytes \u2014 signs include nausea, headache, confusion, and swelling. Treated with electrolytes, never more plain water."}, {"slug": "iako", "term": "Iako", "def": "The crossbeams (booms) connecting the main hull to the ama. Also where a spare steering paddle is typically strapped for quick access."}, {"slug": "kupuna", "term": "K\u016bpuna", "def": "Hawaiian word for elders \u2014 often invoked as the source of traditional canoe-building knowledge and paddling customs passed down through generations."}, {"slug": "mana", "term": "Mana", "def": "Spiritual power or life force. In Hawaiian tradition, a canoe itself is believed to carry mana \u2014 part of why it's treated as a crewmate, not equipment."}, {"slug": "manu", "term": "Manu", "def": "The carved, bird-like piece at the bow and/or stern of a traditional canoe."}, {"slug": "momoa", "term": "Momoa", "def": "A small, otherwise unexplained flat spot at the stern of a traditional canoe \u2014 by tradition, the seat for the canoe's own protective spirit. See the History & Tradition section on the Fundamentals page for the full story."}, {"slug": "nine-man", "term": "Nine-Man", "def": "A long-distance racing format: 9 total paddlers, 6 paddling the canoe at any moment and 3 riding an escort boat, rotating in and out via water changes without the canoe ever stopping. Most SCORA long-distance races, including the Catalina Crossing, are run this way."}, {"slug": "oc6", "term": "OC6", "def": "An outrigger canoe paddled by six people \u2014 the boat class this entire site is about. (An OC1 is the single-paddler version, an OC9 the nine-person escort-boat racing configuration.)"}, {"slug": "overlap", "term": "Overlap", "def": "A right-of-way concept at a turn or mark: whichever canoe has established overlap (bow within the zone) generally has the right of way. Also used more loosely for how far a steersperson has drifted off the direct course line."}, {"slug": "poke", "term": "Poke", "def": "A quick steering correction made by planting the blade flat against the side of the hull \u2014 typically by seat 6 or seat 1 \u2014 and levering off it to turn the boat. Faster and more reflexive than a full draw stroke, but it still acts as a brake, so the best steerspeople keep pokes short, rare, and caught early."}, {"slug": "post", "term": "Post", "def": "A static draw: holding the blade planted at an angle without taking a full stroke, letting the boat's forward motion do the turning work. A subtler, more continuous correction than a full draw stroke."}, {"slug": "rocker", "term": "Rocker", "def": "The curvature of a hull from bow to stern. More rocker makes a hull turn more easily but track less predictably in a straight line; less rocker holds a line well but is harder to turn."}, {"slug": "rhumb-line", "term": "Rhumb Line", "def": "A real nautical term for a straight course of constant compass bearing, pronounced \u201crum line\u201d \u2014 in racing, the direct reference course a steersperson tracks deliberate detours against (chasing a bump, favorable current) to judge whether the detour is actually paying for itself."}, {"slug": "sprayskirt", "term": "Sprayskirt (Skirt)", "def": "A cover over the canoe's cockpit openings that keeps water out. Unzipped back-to-front before a water change and re-zipped front-to-back after, one seat at a time."}, {"slug": "steersperson", "term": "Steersperson (Steersman)", "def": "The paddler in seat 6, responsible for steering and holding final say on safety decisions in the canoe. \u201cSteersman\u201d is the older/traditional term for the same role."}, {"slug": "trim", "term": "Trim", "def": "How a canoe's weight is balanced front-to-back. Poor trim changes how the bow rides and can affect how the hull handles chop or catches a bump \u2014 a lineup consideration alongside side-to-side power balance."}, {"slug": "vaa", "term": "Va\u02bba (Wa\u02bba)", "def": "Hawaiian word for canoe \u2014 spelled va\u02bba or wa\u02bba depending on dialect/source. \u201cVa\u02bba stroke\u201d refers to the traditional outrigger paddling stroke."}, {"slug": "water-change", "term": "Water Change", "def": "A paddler swap during Nine-Man racing where one paddler physically exits into the ocean and another enters, while the canoe keeps moving at speed \u2014 a completely different event from a Hut changeover, where everyone stays seated."}, {"slug": "wave-tuck", "term": "Wave Tuck", "def": "Leaning forward into an oncoming wave to protect the spine, rather than staying upright or leaning back into the impact. Seats 1 and 2 take the brunt of it and benefit most from the habit."}];

document.getElementById('glosslist').innerHTML = GLOSSARY.map(g => `
  <div class="glossentry" id="${g.slug}">
    <dt>${g.term}</dt>
    <dd>${g.def}</dd>
  </div>
`).join('');
</script>
